:3px;background:#FF1814;opacity:.6;\"><\/span><span style=\"width:74%;height:7px;border-radius:4px;background:#d9dde3;\"><\/span><span style=\"width:44%;height:6px;border-radius:3px;background:#e7eaee;\"><\/span><\/div><\/div>\n<div style=\"position:absolute;left:600px;top:150px;width:300px;z-index:25;transform:none;box-shadow:0 0 0 rgba(0,0,0,0);border-radius:8px;transition:left 791ms cubic-bezier(.45,0,.25,1), top 791ms cubic-bezier(.45,0,.25,1), width 791ms cubic-bezier(.45,0,.25,1), transform 200ms ease, box-shadow 200ms ease;\"><div class=\"planner-card draft\"><small>Draft<\/small><strong>Snow Day Policy<\/strong><span>09:30 AM \u00b7 HR Team<\/span><\/div><\/div>\n<div style=\"position:absolute;left:0;top:0;z-index:60;pointer-events:none;transform:translate(470px, 480px);transition:transform 791ms cubic-bezier(.45,0,.25,1);\"><div style=\"width:22px;height:22px;box-sizing:border-box;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(30,35,45,.28);border:2px solid #fff;box-shadow:0 2px 8px rgba(16,24,40,.3);transform:scale(1);transition:transform 120ms ease, background 150ms;\"><\/div><\/div><\/div><\/div><div style=\"display:flex;gap:14px;padding:18px 4px 0;\"><span style=\"font-size:12px;font-weight:700;color:var(--primary-color);padding-top:3px;\">02<\/span><div style=\"display:flex;flex-direction:column;gap:5px;\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.01em;\">Drag to plan, drag back to unplan<\/div><div style=\"font-size:14px;line-height:1.5;color:var(--portal-secondary-text-color);text-wrap:pretty;\">Drop a post on a slot to plan it. Drop it back on Unplanned to clear the date.<\/div><\/div><\/div><\/div>"]]}</script><script>
const viewport=document.querySelector('#viewport');
const frame=document.querySelector('#frame');
const control=document.querySelector('#play');
const icon=control.querySelector('path');
function setControl(label,path){
 control.setAttribute('aria-label',label);
 control.title=label;
 icon.setAttribute('d',path);
}
const recording=JSON.parse(document.querySelector('#recording').textContent);
const template=document.createElement('template');
function paint(markup){
 template.innerHTML=markup;
 patch(frame,template.content);
}
function patch(old,newer){
 for(let i=0;i<newer.childNodes.length;i++){
  const target=newer.childNodes[i],current=old.childNodes[i];
  if(!current){old.append(target.cloneNode(true));continue;}
  if(current.nodeName!==target.nodeName){current.replaceWith(target.cloneNode(true));continue;}
  if(target.nodeType===3){if(current.data!==target.data)current.data=target.data;continue;}
  for(const {name,value} of target.attributes)if(current.getAttribute(name)!==value)current.setAttribute(name,value);
  patch(current,target);
 }
 while(old.childNodes.length>newer.childNodes.length)old.lastChild.remove();
}
new ResizeObserver(()=>frame.style.setProperty('--scale',Math.min(viewport.clientWidth/960,viewport.clientHeight/540))).observe(viewport);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let index=0, timer=0, playing=false;
function stop(){clearTimeout(timer);playing=false;setControl('Play demo','M6 3.5 16 10 6 16.5Z');}
function advance(){
 const current=recording.frames[index];
 paint(current[1]);
 const next=(index+1)%recording.frames.length;
 const delay=next===0?800:recording.frames[next][0]-current[0];
 timer=setTimeout(()=>{index=next;advance();},delay);
}
control.onclick=()=>{
 if(reduced.matches){
  index=(index+1)%recording.frames.length;
  paint(recording.frames[index][1]);
  return;
 }
 if(playing){stop();return;}
 playing=true;setControl('Pause demo','M5 4h3v12H5z M12 4h3v12h-3z');advance();
};
function updateMotion(){
 stop();
 if(reduced.matches)setControl('Next screen','M4 4l9 6-9 6z M14 4h2v12h-2z');
}
reduced.addEventListener('change',updateMotion);
updateMotion();
paint(recording.frames[0][1]);
if(!reduced.matches)control.click();
</script>
