const viewport=document.querySelector('#viewport');
const frame=document.querySelector('#frame');
const control=document.querySelector('#play');
const icon=control.querySelector('path');
function setControl(label,path){
 control.setAttribute('aria-label',label);
 control.title=label;
 icon.setAttribute('d',path);
}
const recording=JSON.parse(document.querySelector('#recording').textContent);
const template=document.createElement('template');
function paint(markup){
 template.innerHTML=markup;
 patch(frame,template.content);
}
function patch(old,newer){
 for(let i=0;i<newer.childNodes.length;i++){
  const target=newer.childNodes[i],current=old.childNodes[i];
  if(!current){old.append(target.cloneNode(true));continue;}
  if(current.nodeName!==target.nodeName){current.replaceWith(target.cloneNode(true));continue;}
  if(target.nodeType===3){if(current.data!==target.data)current.data=target.data;continue;}
  for(const {name,value} of target.attributes)if(current.getAttribute(name)!==value)current.setAttribute(name,value);
  patch(current,target);
 }
 while(old.childNodes.length>newer.childNodes.length)old.lastChild.remove();
}

function stop(){clearTimeout(timer);playing=false;setControl('Play demo','M6 3.5 16 10 6 16.5Z');}
function advance(){
 const current=recording.frames[index];
 paint(current[1]);
 const next=(index+1)%recording.frames.length;
 const delay=next===0?800:recording.frames[next][0]-current[0];
 timer=setTimeout(()=>{index=next;advance();},delay);
}
control.onclick=()=>{
 if(reduced.matches){
  index=(index+1)%recording.frames.length;
  paint(recording.frames[index][1]);
  return;
 }
 if(playing){stop();return;}
 playing=true;setControl('Pause demo','M5 4h3v12H5z M12 4h3v12h-3z');advance();
};
function updateMotion(){
 stop();

}
